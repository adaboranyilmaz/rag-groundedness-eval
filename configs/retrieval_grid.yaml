# Phase 3 retrieval-evaluation grid. See PROJECT_SPEC.md §6 Phase 3 and
# scripts/04_eval_retrieval.py. Every value here is copied into retrieval_grid.json.

chunking_strategies:
  - fixed_size
  - recursive_structural
  - table_aware

embedding_models:
  - bge-small-en-v1.5
  - all-MiniLM-L6-v2
  - bge-base-en-v1.5

methods:
  - dense
  - bm25
  - hybrid
  - hybrid_rerank

# Phase 2 showed FAISS and Qdrant return equivalent top-k, so the grid runs on one backend.
backend: faiss

k_values: [1, 3, 5, 10, 20]

# Search the whole corpus, not only the question's own filing.
search_scope: corpus

bm25:
  k1: 1.5
  b: 0.75

hybrid:
  candidate_depth: 100 # top-N from each of dense and BM25 fed into fusion
  k_rrf: 60 # Cormack et al. (2009); not tuned

rerank:
  model: BAAI/bge-reranker-base
  depth: 50 # rerank the top-50 hybrid candidates
  max_length: 512
  batch_size: 16

relevance:
  min_overlap_frac: 0.5 # overlap >= 50% of the chunk OR >= 50% of the gold span

alignment:
  window_chars: 30
  min_window_coverage: 0.5

selection:
  metric: recall@5
  n_runners_up: 5 # paired-bootstrap comparisons of the winner against the next N cells
  bootstrap_resamples: 10000
  seed: 0

# Number of top chunk ids stored per (cell, question) in retrieval_per_question.jsonl.
store_top_n_ids: 10
