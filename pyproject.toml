[project]
name = "rag-groundedness-eval"
version = "0.1.0"
description = "A measurement harness that separates retrieval failure from generation failure in RAG over financial filings."
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
# The project dependencies are what the served API needs (the Docker image installs only
# these); the rest of the pipeline's tools are the `pipeline` group, which `uv sync`
# installs by default along with `dev`.
dependencies = [
    "sentence-transformers>=6.0.1",
    "faiss-cpu>=1.15.0",
    "torch>=2.14.0",
    "pyyaml>=6.0",
    "anthropic>=1.8.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.21",
]

[dependency-groups]
pipeline = [
    "python-dotenv>=1.0",
    "mlflow>=2.16",
    "dvc>=3.55",
    "pymupdf>=1.28.2",
    "huggingface-hub>=1.30.0",
    "lxml>=6.1.3",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "ollama>=0.6.2",
    "matplotlib>=3.11",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pre-commit>=3.8",
]
# The load generator (scripts/08_load_test.py): `uv run --group loadtest ...`. Not a
# default group, so CI and the image never install it.
loadtest = [
    "locust>=2.32",
]
# RAGAS faithfulness on the hand-labelled answers (scripts/15_ragas_faithfulness.py), as an
# external check on the project's own groundedness judge: `uv run --group ragas ...`. Not a
# default group, so CI and the image never install it (or the frameworks it brings).
ragas = [
    "ragas==0.4.3",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4
    "langchain-community<0.4",
]

[tool.uv]
default-groups = ["pipeline", "dev"]
# ragas pins older fsspec, jiter and rich than the pipeline's lock (datasets and instructor
# caps), so it resolves separately and never moves a pipeline or serving version.
conflicts = [[{ group = "ragas" }, { group = "pipeline" }]]

# CPU-only wheel is the PyPI default on Windows; the RTX 3050 4GB (spec §4 hardware budget)
# needs the CUDA build for embedding to actually use the GPU, not fall back to CPU silently.
# Linux (the Docker image and CI) has no GPU, and PyPI's Linux wheel pulls ~3 GB of CUDA
# libraries, so it takes the CPU build instead.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: the full pipeline on the smoke questions (minutes; `pytest -m integration`)"]
addopts = "-m 'not integration'"
