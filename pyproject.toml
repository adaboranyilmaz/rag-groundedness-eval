[project]
name = "rag-groundedness-eval"
version = "0.1.0"
description = "A measurement harness that separates retrieval failure from generation failure in RAG over financial filings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.0",
    "mlflow>=2.16",
    "dvc>=3.55",
    "pymupdf>=1.28.2",
    "huggingface-hub>=1.30.0",
    "lxml>=6.1.3",
    "sentence-transformers>=6.0.1",
    "faiss-cpu>=1.15.0",
    "qdrant-client>=1.19.0",
    "torch>=2.14.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pre-commit>=3.8",
]

# CPU-only wheel is the PyPI default; RTX 3050 4GB (spec §4 hardware budget) needs the
# CUDA build for embedding to actually use the GPU, not fall back to CPU silently.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
