# The stack: the API, Qdrant (the second vector-store backend) and the MLflow tracking server.
#   cp .env.example .env                  # then set ANTHROPIC_API_KEY (optional, see below)
#   docker compose up -d
#   curl http://localhost:8000/health     # readiness, and Qdrant's and MLflow's reachability
#   curl -X POST http://localhost:8000/query -H "Content-Type: application/json" \
#        -d '{"question": "What was Nike'"'"'s FY2023 revenue?"}'
#   open  http://localhost:5000           # MLflow UI; fill it with
#         MLFLOW_TRACKING_URI=http://localhost:5000 uv run python scripts/09_track_experiments.py track
#
# The API image is published with the serving bundle baked in; `up` pulls it, and builds
# from source only when the pull fails. To build your own (needs build/serving, i.e. the
# DVC data and `scripts/12_serving.py bundle`): `docker compose up -d --build`.
# Without ANTHROPIC_API_KEY the API answers only the 150 benchmark questions whose responses
# are baked in; with it, any question, up to RAG_SERVE_MAX_USD of API spend per state
# volume. RAG_REPLAY_ONLY=1 forbids API calls altogether (the load test's mode).
services:
  api:
    image: ghcr.io/adaboranyilmaz/rag-groundedness-eval-api:0.2.0
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RAG_SERVE_MAX_USD: ${RAG_SERVE_MAX_USD:-1.0}
      RAG_REPLAY_ONLY: ${RAG_REPLAY_ONLY:-0}
    volumes:
      - api_state:/app/state # request logs, new responses, the spend ledger
    depends_on:
      qdrant:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.19.1 # match qdrant-client==1.19.0 in pyproject.toml
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck: # the image has no curl; open a TCP connection to the REST port instead
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0 # match mlflow==3.16.0 in uv.lock
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  api_state:
  qdrant_storage:
  mlflow_data:
